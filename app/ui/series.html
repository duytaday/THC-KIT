<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THC · Series studio</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/series.css"></head>
<body><header><div class="brand"><img src="/icon.svg" alt=""><span>Talking Head Cutroom</span></div><a href="/">← Workspace</a></header>
